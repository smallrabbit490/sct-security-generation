<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="2500" height="680" viewBox="0 0 2500 680"><title>经验卡能帮助测试发现通用检查遗漏的错误吗？</title><rect x="0" y="0" width="2500" height="680" rx="0" fill="#f6f8fa" stroke="none"/><text x="52" y="62" fill="#23364a" font-family="Times New Roman, SimSun, 宋体" font-size="45" font-weight="bold">经验卡能帮助测试发现通用检查遗漏的错误吗？</text><text x="53" y="107" fill="#23364a" font-family="Times New Roman, SimSun, 宋体" font-size="28" font-weight="normal">来源：用户提出复用代码验证经验检查，并核对误报。</text><text x="53" y="149" fill="#425d72" font-family="Times New Roman, SimSun, 宋体" font-size="24" font-weight="normal">本周证据  ·  11月4日18:56（北京时间）  ·  点击实验编号查看对照</text><rect x="43" y="175" width="326" height="52" rx="8" fill="#1d3447" stroke="none"/><text x="56" y="211" fill="white" font-family="Times New Roman, SimSun, 宋体" font-size="29" font-weight="bold">S0 为什么做</text><rect x="43" y="234" width="326" height="119" rx="8" fill="#ffffff" stroke="#92a6af"/><text x="55" y="262" fill="#23364a" font-family="Times New Roman, SimSun, 宋体" font-size="22" font-weight="normal">卡片中的提醒能否变成真实反例？</text><path d="M369,200 H379" stroke="#54718a" fill="none" stroke-width="3"/><path d="M378,194 l9,6 l-9,6 z" fill="#54718a"/><rect x="391" y="175" width="326" height="52" rx="8" fill="#1d3447" stroke="none"/><text x="404" y="211" fill="white" font-family="Times New Roman, SimSun, 宋体" font-size="29" font-weight="bold">S1 怎样比较</text><a href="../10%E6%9C%8829%E6%97%A5-11%E6%9C%884%E6%97%A5%E5%AE%9E%E9%AA%8C%E6%8E%A2%E7%B4%A2%E6%8A%A5%E5%91%8A.md#a8"><rect x="391" y="234" width="326" height="119" rx="8" fill="#ffffff" stroke="#92a6af"/><text x="403" y="262" fill="#23364a" font-family="Times New Roman, SimSun, 宋体" font-size="22" font-weight="normal">同一份代码比较基础、通用和经</text><text x="403" y="287" fill="#23364a" font-family="Times New Roman, SimSun, 宋体" font-size="22" font-weight="normal">验输入。</text><text x="401" y="346" fill="#195777" font-family="Times New Roman, SimSun, 宋体" font-size="19" font-weight="bold">【A8】</text></a><path d="M717,200 H727" stroke="#54718a" fill="none" stroke-width="3"/><path d="M726,194 l9,6 l-9,6 z" fill="#54718a"/><rect x="739" y="175" width="326" height="52" rx="8" fill="#1d3447" stroke="none"/><text x="752" y="211" fill="white" font-family="Times New Roman, SimSun, 宋体" font-size="29" font-weight="bold">S2 先验证什么</text><a href="../10%E6%9C%8829%E6%97%A5-11%E6%9C%884%E6%97%A5%E5%AE%9E%E9%AA%8C%E6%8E%A2%E7%B4%A2%E6%8A%A5%E5%91%8A.md#a6"><rect x="739" y="234" width="326" height="119" rx="8" fill="#ffffff" stroke="#92a6af"/><text x="751" y="262" fill="#23364a" font-family="Times New Roman, SimSun, 宋体" font-size="22" font-weight="normal">首批3族没有额外发现。</text><text x="749" y="346" fill="#195777" font-family="Times New Roman, SimSun, 宋体" font-size="19" font-weight="bold">【A6】</text></a><path d="M1065,200 H1075" stroke="#54718a" fill="none" stroke-width="3"/><path d="M1074,194 l9,6 l-9,6 z" fill="#54718a"/><rect x="1087" y="175" width="326" height="52" rx="8" fill="#1d3447" stroke="none"/><text x="1100" y="211" fill="white" font-family="Times New Roman, SimSun, 宋体" font-size="29" font-weight="bold">S3 小实验发现</text><a href="../10%E6%9C%8829%E6%97%A5-11%E6%9C%884%E6%97%A5%E5%AE%9E%E9%AA%8C%E6%8E%A2%E7%B4%A2%E6%8A%A5%E5%91%8A.md#a7"><rect x="1087" y="234" width="326" height="119" rx="8" fill="#e4f1ec" stroke="#92a6af"/><text x="1099" y="262" fill="#23364a" font-family="Times New Roman, SimSun, 宋体" font-size="22" font-weight="normal">换3族后，收据题的两份代码把</text><text x="1099" y="287" fill="#23364a" font-family="Times New Roman, SimSun, 宋体" font-size="22" font-weight="normal">数据再次当模板解析。</text><text x="1097" y="346" fill="#195777" font-family="Times New Roman, SimSun, 宋体" font-size="19" font-weight="bold">【A7】</text></a><path d="M1413,200 H1423" stroke="#54718a" fill="none" stroke-width="3"/><path d="M1422,194 l9,6 l-9,6 z" fill="#54718a"/><rect x="1435" y="175" width="326" height="52" rx="8" fill="#1d3447" stroke="none"/><text x="1448" y="211" fill="white" font-family="Times New Roman, SimSun, 宋体" font-size="29" font-weight="bold">S4 怎样改进</text><a href="../10%E6%9C%8829%E6%97%A5-11%E6%9C%884%E6%97%A5%E5%AE%9E%E9%AA%8C%E6%8E%A2%E7%B4%A2%E6%8A%A5%E5%91%8A.md#a10"><rect x="1435" y="234" width="326" height="119" rx="8" fill="#ffffff" stroke="#92a6af"/><text x="1447" y="262" fill="#23364a" font-family="Times New Roman, SimSun, 宋体" font-size="22" font-weight="normal">加强通用对照，并核对实际来源</text><text x="1447" y="287" fill="#23364a" font-family="Times New Roman, SimSun, 宋体" font-size="22" font-weight="normal">卡。</text><text x="1445" y="346" fill="#195777" font-family="Times New Roman, SimSun, 宋体" font-size="19" font-weight="bold">【A10】</text></a><path d="M1761,200 H1771" stroke="#54718a" fill="none" stroke-width="3"/><path d="M1770,194 l9,6 l-9,6 z" fill="#54718a"/><rect x="1783" y="175" width="326" height="52" rx="8" fill="#1d3447" stroke="none"/><text x="1796" y="211" fill="white" font-family="Times New Roman, SimSun, 宋体" font-size="29" font-weight="bold">S5 主要比较</text><a href="../10%E6%9C%8829%E6%97%A5-11%E6%9C%884%E6%97%A5%E5%AE%9E%E9%AA%8C%E6%8E%A2%E7%B4%A2%E6%8A%A5%E5%91%8A.md#a11"><rect x="1783" y="234" width="326" height="119" rx="8" fill="#e4f1ec" stroke="#92a6af"/><text x="1795" y="262" fill="#23364a" font-family="Times New Roman, SimSun, 宋体" font-size="22" font-weight="normal">新21族经验独有4族，通用独有</text><text x="1795" y="287" fill="#23364a" font-family="Times New Roman, SimSun, 宋体" font-size="22" font-weight="normal">3族；经验只涉及一种机制。</text><text x="1793" y="346" fill="#195777" font-family="Times New Roman, SimSun, 宋体" font-size="19" font-weight="bold">【A11】</text></a><path d="M2109,200 H2119" stroke="#54718a" fill="none" stroke-width="3"/><path d="M2118,194 l9,6 l-9,6 z" fill="#54718a"/><rect x="2131" y="175" width="326" height="52" rx="8" fill="#1d3447" stroke="none"/><text x="2144" y="211" fill="white" font-family="Times New Roman, SimSun, 宋体" font-size="29" font-weight="bold">S6 本周结论</text><a href="../10%E6%9C%8829%E6%97%A5-11%E6%9C%884%E6%97%A5%E5%AE%9E%E9%AA%8C%E6%8E%A2%E7%B4%A2%E6%8A%A5%E5%91%8A.md#a12"><rect x="2131" y="234" width="326" height="119" rx="8" fill="#e4f1ec" stroke="#92a6af"/><text x="2143" y="262" fill="#23364a" font-family="Times New Roman, SimSun, 宋体" font-size="22" font-weight="normal">保留车辆字段线索，当前版本停</text><text x="2143" y="287" fill="#23364a" font-family="Times New Roman, SimSun, 宋体" font-size="22" font-weight="normal">止扩大。</text><text x="2141" y="346" fill="#195777" font-family="Times New Roman, SimSun, 宋体" font-size="19" font-weight="bold">【A12】</text></a><path d="M1598.0,354 V408" stroke="#819baa" fill="none" stroke-width="3"/><a href="../10%E6%9C%8829%E6%97%A5-11%E6%9C%884%E6%97%A5%E5%AE%9E%E9%AA%8C%E6%8E%A2%E7%B4%A2%E6%8A%A5%E5%91%8A.md#a10"><rect x="1295" y="409" width="650" height="153" rx="8" fill="#fff5dc" stroke="#c8af6f"/><text x="1317" y="450" fill="#23364a" font-family="Times New Roman, SimSun, 宋体" font-size="28" font-weight="bold">来源核对</text><text x="1317" y="488" fill="#23364a" font-family="Times New Roman, SimSun, 宋体" font-size="23" font-weight="normal">240份输出中，仅23份显式列出离线来源卡。</text><text x="1313" y="548" fill="#195777" font-family="Times New Roman, SimSun, 宋体" font-size="19" font-weight="bold">【A10】</text></a><text x="52" y="636" fill="#23364a" font-family="Times New Roman, SimSun, 宋体" font-size="25" font-weight="normal">主线从左向右阅读；下方支线是对同一问题的另一项核查。</text></svg>