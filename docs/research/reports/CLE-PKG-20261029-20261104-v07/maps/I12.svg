<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="2500" height="680" viewBox="0 0 2500 680"><title>修复动作怎样从来源题进入卡片并影响最终代码？</title><rect x="0" y="0" width="2500" height="680" rx="0" fill="#f6f8fa" stroke="none"/><text x="52" y="62" fill="#23364a" font-family="Times New Roman, SimSun, 宋体" font-size="45" font-weight="bold">修复动作怎样从来源题进入卡片并影响最终代码？</text><text x="53" y="107" fill="#23364a" font-family="Times New Roman, SimSun, 宋体" font-size="28" font-weight="normal">来源：用户明确研究 CLE 提炼方式的更新及其对 Joint 的影响。</text><text x="53" y="149" fill="#425d72" font-family="Times New Roman, SimSun, 宋体" font-size="24" font-weight="normal">本周证据  ·  11月4日18:56（北京时间）  ·  点击实验编号查看对照</text><rect x="43" y="175" width="326" height="52" rx="8" fill="#1d3447" stroke="none"/><text x="56" y="211" fill="white" font-family="Times New Roman, SimSun, 宋体" font-size="29" font-weight="bold">S0 为什么做</text><rect x="43" y="234" width="326" height="119" rx="8" fill="#ffffff" stroke="#92a6af"/><text x="55" y="262" fill="#23364a" font-family="Times New Roman, SimSun, 宋体" font-size="22" font-weight="normal">原生写卡曾把读取已有名单写成</text><text x="55" y="287" fill="#23364a" font-family="Times New Roman, SimSun, 宋体" font-size="22" font-weight="normal">自建示例名单。</text><path d="M369,200 H379" stroke="#54718a" fill="none" stroke-width="3"/><path d="M378,194 l9,6 l-9,6 z" fill="#54718a"/><rect x="391" y="175" width="326" height="52" rx="8" fill="#1d3447" stroke="none"/><text x="404" y="211" fill="white" font-family="Times New Roman, SimSun, 宋体" font-size="29" font-weight="bold">S1 怎样比较</text><a href="../10%E6%9C%8829%E6%97%A5-11%E6%9C%884%E6%97%A5%E5%AE%9E%E9%AA%8C%E6%8E%A2%E7%B4%A2%E6%8A%A5%E5%91%8A.md#a19"><rect x="391" y="234" width="326" height="119" rx="8" fill="#ffffff" stroke="#92a6af"/><text x="403" y="262" fill="#23364a" font-family="Times New Roman, SimSun, 宋体" font-size="22" font-weight="normal">比较原生提炼、锁定已验证动作</text><text x="403" y="287" fill="#23364a" font-family="Times New Roman, SimSun, 宋体" font-size="22" font-weight="normal">和简单动作规则。</text><text x="401" y="346" fill="#195777" font-family="Times New Roman, SimSun, 宋体" font-size="19" font-weight="bold">【A19】</text></a><path d="M717,200 H727" stroke="#54718a" fill="none" stroke-width="3"/><path d="M726,194 l9,6 l-9,6 z" fill="#54718a"/><rect x="739" y="175" width="326" height="52" rx="8" fill="#1d3447" stroke="none"/><text x="752" y="211" fill="white" font-family="Times New Roman, SimSun, 宋体" font-size="29" font-weight="bold">S2 先验证什么</text><a href="../10%E6%9C%8829%E6%97%A5-11%E6%9C%884%E6%97%A5%E5%AE%9E%E9%AA%8C%E6%8E%A2%E7%B4%A2%E6%8A%A5%E5%91%8A.md#a18"><rect x="739" y="234" width="326" height="119" rx="8" fill="#ffffff" stroke="#92a6af"/><text x="751" y="262" fill="#23364a" font-family="Times New Roman, SimSun, 宋体" font-size="22" font-weight="normal">五来源复审，三种写法均只有</text><text x="751" y="287" fill="#23364a" font-family="Times New Roman, SimSun, 宋体" font-size="22" font-weight="normal">3/5整卡合格。</text><text x="749" y="346" fill="#195777" font-family="Times New Roman, SimSun, 宋体" font-size="19" font-weight="bold">【A18】</text></a><path d="M1065,200 H1075" stroke="#54718a" fill="none" stroke-width="3"/><path d="M1074,194 l9,6 l-9,6 z" fill="#54718a"/><rect x="1087" y="175" width="326" height="52" rx="8" fill="#1d3447" stroke="none"/><text x="1100" y="211" fill="white" font-family="Times New Roman, SimSun, 宋体" font-size="29" font-weight="bold">S3 小实验发现</text><a href="../10%E6%9C%8829%E6%97%A5-11%E6%9C%884%E6%97%A5%E5%AE%9E%E9%AA%8C%E6%8E%A2%E7%B4%A2%E6%8A%A5%E5%91%8A.md#a19"><rect x="1087" y="234" width="326" height="119" rx="8" fill="#e4f1ec" stroke="#92a6af"/><text x="1099" y="262" fill="#23364a" font-family="Times New Roman, SimSun, 宋体" font-size="22" font-weight="normal">固定选卡开发题，原生1/6，两</text><text x="1099" y="287" fill="#23364a" font-family="Times New Roman, SimSun, 宋体" font-size="22" font-weight="normal">个动作组均6/6。</text><text x="1097" y="346" fill="#195777" font-family="Times New Roman, SimSun, 宋体" font-size="19" font-weight="bold">【A19】</text></a><path d="M1413,200 H1423" stroke="#54718a" fill="none" stroke-width="3"/><path d="M1422,194 l9,6 l-9,6 z" fill="#54718a"/><rect x="1435" y="175" width="326" height="52" rx="8" fill="#1d3447" stroke="none"/><text x="1448" y="211" fill="white" font-family="Times New Roman, SimSun, 宋体" font-size="29" font-weight="bold">S4 怎样改进</text><a href="../10%E6%9C%8829%E6%97%A5-11%E6%9C%884%E6%97%A5%E5%AE%9E%E9%AA%8C%E6%8E%A2%E7%B4%A2%E6%8A%A5%E5%91%8A.md#a20"><rect x="1435" y="234" width="326" height="119" rx="8" fill="#ffffff" stroke="#92a6af"/><text x="1447" y="262" fill="#23364a" font-family="Times New Roman, SimSun, 宋体" font-size="22" font-weight="normal">冻结动作做迁移，再让模型真实</text><text x="1447" y="287" fill="#23364a" font-family="Times New Roman, SimSun, 宋体" font-size="22" font-weight="normal">提炼、自然检索。</text><text x="1445" y="346" fill="#195777" font-family="Times New Roman, SimSun, 宋体" font-size="19" font-weight="bold">【A20】</text></a><path d="M1761,200 H1771" stroke="#54718a" fill="none" stroke-width="3"/><path d="M1770,194 l9,6 l-9,6 z" fill="#54718a"/><rect x="1783" y="175" width="326" height="52" rx="8" fill="#1d3447" stroke="none"/><text x="1796" y="211" fill="white" font-family="Times New Roman, SimSun, 宋体" font-size="29" font-weight="bold">S5 主要比较</text><a href="../10%E6%9C%8829%E6%97%A5-11%E6%9C%884%E6%97%A5%E5%AE%9E%E9%AA%8C%E6%8E%A2%E7%B4%A2%E6%8A%A5%E5%91%8A.md#a24"><rect x="1783" y="234" width="326" height="119" rx="8" fill="#e4f1ec" stroke="#92a6af"/><text x="1795" y="262" fill="#23364a" font-family="Times New Roman, SimSun, 宋体" font-size="22" font-weight="normal">六族复测11个可比配对净增1；</text><text x="1795" y="287" fill="#23364a" font-family="Times New Roman, SimSun, 宋体" font-size="22" font-weight="normal">三张新版卡实际采用0次。</text><text x="1793" y="346" fill="#195777" font-family="Times New Roman, SimSun, 宋体" font-size="19" font-weight="bold">【A24】</text></a><path d="M2109,200 H2119" stroke="#54718a" fill="none" stroke-width="3"/><path d="M2118,194 l9,6 l-9,6 z" fill="#54718a"/><rect x="2131" y="175" width="326" height="52" rx="8" fill="#1d3447" stroke="none"/><text x="2144" y="211" fill="white" font-family="Times New Roman, SimSun, 宋体" font-size="29" font-weight="bold">S6 本周结论</text><a href="../10%E6%9C%8829%E6%97%A5-11%E6%9C%884%E6%97%A5%E5%AE%9E%E9%AA%8C%E6%8E%A2%E7%B4%A2%E6%8A%A5%E5%91%8A.md#a25"><rect x="2131" y="234" width="326" height="119" rx="8" fill="#e4f1ec" stroke="#92a6af"/><text x="2143" y="262" fill="#23364a" font-family="Times New Roman, SimSun, 宋体" font-size="22" font-weight="normal">保留来源动作证据。自然流程维</text><text x="2143" y="287" fill="#23364a" font-family="Times New Roman, SimSun, 宋体" font-size="22" font-weight="normal">持原生默认。</text><text x="2141" y="346" fill="#195777" font-family="Times New Roman, SimSun, 宋体" font-size="19" font-weight="bold">【A25】</text></a><path d="M1946.0,354 V408" stroke="#819baa" fill="none" stroke-width="3"/><a href="../10%E6%9C%8829%E6%97%A5-11%E6%9C%884%E6%97%A5%E5%AE%9E%E9%AA%8C%E6%8E%A2%E7%B4%A2%E6%8A%A5%E5%91%8A.md#a23"><rect x="1643" y="409" width="650" height="153" rx="8" fill="#fff5dc" stroke="#c8af6f"/><text x="1665" y="450" fill="#23364a" font-family="Times New Roman, SimSun, 宋体" font-size="28" font-weight="bold">对已存失败代码回放</text><text x="1665" y="488" fill="#23364a" font-family="Times New Roman, SimSun, 宋体" font-size="23" font-weight="normal">按公开要求局部修复救回4份已测失败；另1份恢复测量。</text><text x="1661" y="548" fill="#195777" font-family="Times New Roman, SimSun, 宋体" font-size="19" font-weight="bold">【A23】</text></a><text x="52" y="636" fill="#23364a" font-family="Times New Roman, SimSun, 宋体" font-size="25" font-weight="normal">主线从左向右阅读；下方支线是对同一问题的另一项核查。</text></svg>