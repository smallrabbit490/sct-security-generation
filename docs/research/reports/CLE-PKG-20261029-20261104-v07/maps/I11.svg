<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="2500" height="680" viewBox="0 0 2500 680"><title>手工精修哪些卡片，才能保留题目需要的行为？</title><rect x="0" y="0" width="2500" height="680" rx="0" fill="#f6f8fa" stroke="none"/><text x="52" y="62" fill="#23364a" font-family="Times New Roman, SimSun, 宋体" font-size="45" font-weight="bold">手工精修哪些卡片，才能保留题目需要的行为？</text><text x="53" y="107" fill="#23364a" font-family="Times New Roman, SimSun, 宋体" font-size="28" font-weight="normal">来源：用户要求从题面明确、实际见卡的失败代码中定位改卡目标。</text><text x="53" y="149" fill="#425d72" font-family="Times New Roman, SimSun, 宋体" font-size="24" font-weight="normal">本周证据  ·  11月4日18:56（北京时间）  ·  点击实验编号查看对照</text><rect x="43" y="175" width="326" height="52" rx="8" fill="#1d3447" stroke="none"/><text x="56" y="211" fill="white" font-family="Times New Roman, SimSun, 宋体" font-size="29" font-weight="bold">S0 为什么做</text><rect x="43" y="234" width="326" height="119" rx="8" fill="#ffffff" stroke="#92a6af"/><text x="55" y="262" fill="#23364a" font-family="Times New Roman, SimSun, 宋体" font-size="22" font-weight="normal">先把题面缺项与代码实现错误分</text><text x="55" y="287" fill="#23364a" font-family="Times New Roman, SimSun, 宋体" font-size="22" font-weight="normal">开。</text><path d="M369,200 H379" stroke="#54718a" fill="none" stroke-width="3"/><path d="M378,194 l9,6 l-9,6 z" fill="#54718a"/><rect x="391" y="175" width="326" height="52" rx="8" fill="#1d3447" stroke="none"/><text x="404" y="211" fill="white" font-family="Times New Roman, SimSun, 宋体" font-size="29" font-weight="bold">S1 怎样比较</text><a href="../10%E6%9C%8829%E6%97%A5-11%E6%9C%884%E6%97%A5%E5%AE%9E%E9%AA%8C%E6%8E%A2%E7%B4%A2%E6%8A%A5%E5%91%8A.md#a13"><rect x="391" y="234" width="326" height="119" rx="8" fill="#ffffff" stroke="#92a6af"/><text x="403" y="262" fill="#23364a" font-family="Times New Roman, SimSun, 宋体" font-size="22" font-weight="normal">原卡、修订卡和公开通用规则同</text><text x="403" y="287" fill="#23364a" font-family="Times New Roman, SimSun, 宋体" font-size="22" font-weight="normal">题对照。</text><text x="401" y="346" fill="#195777" font-family="Times New Roman, SimSun, 宋体" font-size="19" font-weight="bold">【A13】</text></a><path d="M717,200 H727" stroke="#54718a" fill="none" stroke-width="3"/><path d="M726,194 l9,6 l-9,6 z" fill="#54718a"/><rect x="739" y="175" width="326" height="52" rx="8" fill="#1d3447" stroke="none"/><text x="752" y="211" fill="white" font-family="Times New Roman, SimSun, 宋体" font-size="29" font-weight="bold">S2 先验证什么</text><a href="../10%E6%9C%8829%E6%97%A5-11%E6%9C%884%E6%97%A5%E5%AE%9E%E9%AA%8C%E6%8E%A2%E7%B4%A2%E6%8A%A5%E5%91%8A.md#a13"><rect x="739" y="234" width="326" height="119" rx="8" fill="#ffffff" stroke="#92a6af"/><text x="751" y="262" fill="#23364a" font-family="Times New Roman, SimSun, 宋体" font-size="22" font-weight="normal">23族修订相对原卡损失3次。</text><text x="749" y="346" fill="#195777" font-family="Times New Roman, SimSun, 宋体" font-size="19" font-weight="bold">【A13】</text></a><path d="M1065,200 H1075" stroke="#54718a" fill="none" stroke-width="3"/><path d="M1074,194 l9,6 l-9,6 z" fill="#54718a"/><rect x="1087" y="175" width="326" height="52" rx="8" fill="#1d3447" stroke="none"/><text x="1100" y="211" fill="white" font-family="Times New Roman, SimSun, 宋体" font-size="29" font-weight="bold">S3 小实验发现</text><a href="../10%E6%9C%8829%E6%97%A5-11%E6%9C%884%E6%97%A5%E5%AE%9E%E9%AA%8C%E6%8E%A2%E7%B4%A2%E6%8A%A5%E5%91%8A.md#a15"><rect x="1087" y="234" width="326" height="119" rx="8" fill="#e4f1ec" stroke="#92a6af"/><text x="1099" y="262" fill="#23364a" font-family="Times New Roman, SimSun, 宋体" font-size="22" font-weight="normal">针对角色精修的五族由3/10到</text><text x="1099" y="287" fill="#23364a" font-family="Times New Roman, SimSun, 宋体" font-size="22" font-weight="normal">7/10。</text><text x="1097" y="346" fill="#195777" font-family="Times New Roman, SimSun, 宋体" font-size="19" font-weight="bold">【A15】</text></a><path d="M1413,200 H1423" stroke="#54718a" fill="none" stroke-width="3"/><path d="M1422,194 l9,6 l-9,6 z" fill="#54718a"/><rect x="1435" y="175" width="326" height="52" rx="8" fill="#1d3447" stroke="none"/><text x="1448" y="211" fill="white" font-family="Times New Roman, SimSun, 宋体" font-size="29" font-weight="bold">S4 怎样改进</text><a href="../10%E6%9C%8829%E6%97%A5-11%E6%9C%884%E6%97%A5%E5%AE%9E%E9%AA%8C%E6%8E%A2%E7%B4%A2%E6%8A%A5%E5%91%8A.md#a17"><rect x="1435" y="234" width="326" height="119" rx="8" fill="#ffffff" stroke="#92a6af"/><text x="1447" y="262" fill="#23364a" font-family="Times New Roman, SimSun, 宋体" font-size="22" font-weight="normal">扩大到50族，再固定同卡、换</text><text x="1447" y="287" fill="#23364a" font-family="Times New Roman, SimSun, 宋体" font-size="22" font-weight="normal">留出题。</text><text x="1445" y="346" fill="#195777" font-family="Times New Roman, SimSun, 宋体" font-size="19" font-weight="bold">【A17】</text></a><path d="M1761,200 H1771" stroke="#54718a" fill="none" stroke-width="3"/><path d="M1770,194 l9,6 l-9,6 z" fill="#54718a"/><rect x="1783" y="175" width="326" height="52" rx="8" fill="#1d3447" stroke="none"/><text x="1796" y="211" fill="white" font-family="Times New Roman, SimSun, 宋体" font-size="29" font-weight="bold">S5 主要比较</text><a href="../10%E6%9C%8829%E6%97%A5-11%E6%9C%884%E6%97%A5%E5%AE%9E%E9%AA%8C%E6%8E%A2%E7%B4%A2%E6%8A%A5%E5%91%8A.md#a16"><rect x="1783" y="234" width="326" height="119" rx="8" fill="#e4f1ec" stroke="#92a6af"/><text x="1795" y="262" fill="#23364a" font-family="Times New Roman, SimSun, 宋体" font-size="22" font-weight="normal">统一改写57/100对59/100；同</text><text x="1795" y="287" fill="#23364a" font-family="Times New Roman, SimSun, 宋体" font-size="22" font-weight="normal">卡精修68/100对65/100。</text><text x="1793" y="346" fill="#195777" font-family="Times New Roman, SimSun, 宋体" font-size="19" font-weight="bold">【A16】</text></a><path d="M2109,200 H2119" stroke="#54718a" fill="none" stroke-width="3"/><path d="M2118,194 l9,6 l-9,6 z" fill="#54718a"/><rect x="2131" y="175" width="326" height="52" rx="8" fill="#1d3447" stroke="none"/><text x="2144" y="211" fill="white" font-family="Times New Roman, SimSun, 宋体" font-size="29" font-weight="bold">S6 本周结论</text><a href="../10%E6%9C%8829%E6%97%A5-11%E6%9C%884%E6%97%A5%E5%AE%9E%E9%AA%8C%E6%8E%A2%E7%B4%A2%E6%8A%A5%E5%91%8A.md#a17"><rect x="2131" y="234" width="326" height="119" rx="8" fill="#e4f1ec" stroke="#92a6af"/><text x="2143" y="262" fill="#23364a" font-family="Times New Roman, SimSun, 宋体" font-size="22" font-weight="normal">同卡有正向信号，两个重复方向</text><text x="2143" y="287" fill="#23364a" font-family="Times New Roman, SimSun, 宋体" font-size="22" font-weight="normal">不同。</text><text x="2141" y="346" fill="#195777" font-family="Times New Roman, SimSun, 宋体" font-size="19" font-weight="bold">【A17】</text></a><path d="M1250.0,354 V408" stroke="#819baa" fill="none" stroke-width="3"/><a href="../10%E6%9C%8829%E6%97%A5-11%E6%9C%884%E6%97%A5%E5%AE%9E%E9%AA%8C%E6%8E%A2%E7%B4%A2%E6%8A%A5%E5%91%8A.md#a14"><rect x="947" y="409" width="650" height="153" rx="8" fill="#fff5dc" stroke="#c8af6f"/><text x="969" y="450" fill="#23364a" font-family="Times New Roman, SimSun, 宋体" font-size="28" font-weight="bold">代码上单独验证</text><text x="969" y="488" fill="#23364a" font-family="Times New Roman, SimSun, 宋体" font-size="23" font-weight="normal">114份代码中，删覆盖净救回12份，安全通过数下降。</text><text x="965" y="548" fill="#195777" font-family="Times New Roman, SimSun, 宋体" font-size="19" font-weight="bold">【A14】</text></a><text x="52" y="636" fill="#23364a" font-family="Times New Roman, SimSun, 宋体" font-size="25" font-weight="normal">主线从左向右阅读；下方支线是对同一问题的另一项核查。</text></svg>